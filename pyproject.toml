[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wikify-repo"
version = "0.2.0"
description = "Ingest a code repo into a grounded, lint-clean markdown wiki"
requires-python = ">=3.11"
dependencies = ["protobuf>=5.29,<7", "pyyaml", "typer", "gitpython"]

[project.scripts]
wikify = "wikify.cli:app"

[dependency-groups]
dev = ["pytest"]

[tool.setuptools]
packages = ["wikify"]

[tool.setuptools.package-data]
# The agent skills ship inside the wheel so `wikify setup` can install them without a
# repo checkout (pipx installs). .agents/skills/ in this repo symlinks here.
wikify = ["skills/*/*.md", "skills/*/prompts/*.md", "scip.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
